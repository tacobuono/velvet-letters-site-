<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Velvet Letters">
  <!-- A single sort of brass type, inked. V and L share one stem: the diagonal
       lands on it (V), the foot grows out of it (L). Three strokes, so it holds at 16px. -->
  <defs>
    <linearGradient id="brass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d8c08a"/>
      <stop offset=".55" stop-color="#b7935a"/>
      <stop offset="1" stop-color="#8a6a38"/>
    </linearGradient>
    <linearGradient id="bevel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff5dc" stop-opacity=".55"/>
      <stop offset="1" stop-color="#3a2a14" stop-opacity=".45"/>
    </linearGradient>
  </defs>

  <!-- Body of the sort -->
  <rect width="64" height="64" rx="12" fill="url(#brass)"/>
  <rect x="1" y="1" width="62" height="62" rx="11" fill="none" stroke="url(#bevel)" stroke-width="1.5"/>

  <!-- Letterface, drawn twice: a lit edge a hair below, then the ink on top.
       Slab serifs top-left and on the stem, a turned-up terminal on the foot. -->
  <g id="face">
    <!-- V's left arm, tapering to the vertex at the foot of the stem -->
    <polygon points="9,14 22,14 45,51 38,51"/>
    <rect x="5" y="14" width="20" height="4.5"/>
    <!-- shared stem: V's right arm and L's upright -->
    <rect x="38" y="14" width="11" height="37"/>
    <rect x="34" y="14" width="19" height="4.5"/>
    <!-- L's foot, with a terminal that turns up -->
    <rect x="38" y="41" width="21" height="10"/>
    <rect x="54.5" y="35" width="4.5" height="16"/>
  </g>
  <use href="#face" y="1.2" fill="#e9d6a4" fill-opacity=".55"/>
  <use href="#face" fill="#4f1530"/>
</svg>
